<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piškvorky</title>
    <link rel="stylesheet" href="pis_game.css" />
</head>
<body>
    <div class="game-shell">

        <section id="settingsScreen" class="screen">
            <header class="game-header">
                <div>
                    <h1>Piškvorky</h1>
                    <p>Nejdřív nastav hru. Samotná hra pak poběží na čisté herní obrazovce.</p>
                </div>
            </header>

            <main class="layout single-panel">
                <section class="panel">
                    <h2>Nastavení</h2>

                    <div class="field-group">
                        <label>Režim hry</label>
                        <div class="row-buttons">
                            <button id="modeHumanBtn" class="toggle-button active" type="button">Hráč vs hráč</button>
                            <button id="modeAiBtn" class="toggle-button" type="button">Hráč vs program</button>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="player1Name">Jméno hráče 1</label>
                        <input id="player1Name" type="text" value="Hráč 1" />
                    </div>

                    <div class="field-group">
                        <label for="player1Color">Barva hráče 1</label>
                        <select id="player1Color">
                            <option value="red">Červená</option>
                            <option value="blue">Modrá</option>
                            <option value="green">Zelená</option>
                            <option value="gold">Tmavě žlutá</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="player2Name">Jméno hráče 2 / programu</label>
                        <input id="player2Name" type="text" value="Program" />
                    </div>

                    <div class="field-group">
                        <label for="player2Color">Barva hráče 2</label>
                        <select id="player2Color">
                            <option value="red">Červená</option>
                            <option value="blue" selected>Modrá</option>
                            <option value="green">Zelená</option>
                            <option value="gold">Tmavě žlutá</option>
                        </select>
                    </div>

                    <div class="field-group checkbox-row">
                        <input id="threeStoneMode" type="checkbox" />
                        <label for="threeStoneMode">Režim 3 kameny</label>
                    </div>

                    <div class="field-group">
                        <label for="removeMode">Odebírání starého kamene</label>
                        <select id="removeMode">
                            <option value="last">Standard - poslední starší</option>
                            <option value="random">Náhodný starší</option>
                        </select>
                    </div>

                    <div class="setup-preview">
                        <div class="player-preview-card">
                            <div id="player1DisplayName" class="player-name">Hráč 1</div>
                            <div class="player-symbol-preview">O</div>
                        </div>

                        <div class="player-preview-card">
                            <div id="player2DisplayName" class="player-name">Program</div>
                            <div class="player-symbol-preview">X</div>
                        </div>
                    </div>

                    <button id="startGameBtn" class="primary-button" type="button">Spustit hru</button>
                </section>
            </main>
        </section>

        <section id="gameScreen" class="screen hidden">
            <header class="game-header game-header-minimal">
                <div class="header-spacer"></div>

                <div class="menu-wrap">
                    <button id="menuButton" class="menu-button" type="button">⋮</button>
                    <div id="menuPanel" class="menu-panel hidden">
                        <button id="restartGameBtn" type="button">Nové kolo</button>
                        <button id="backToSetupBtn" type="button">Změnit nastavení</button>
                        <button id="goHomeBtn" type="button">Hlavní nabídka</button>
                        <button id="closeMenuBtn" type="button">Zavřít menu</button>
                    </div>
                </div>
            </header>

            <main class="game-only-layout">
                <div class="players-strip">
                    <div id="player1Card" class="player-card-game">
                        <div class="player-card-content rotate-mobile">
                            <div class="player-name-wrapper">
                                <span id="gamePlayer1Name" class="game-player-name">Hráč 1 (O)</span>
                            </div>
                            <div id="player1Score" class="score-box">0</div>
                        </div>
                    </div>

                    <div id="player2Card" class="player-card-game">
                        <div class="player-card-content">
                            <div class="player-name-wrapper">
                                <span id="gamePlayer2Name" class="game-player-name">Program (X)</span>
                            </div>
                            <div id="player2Score" class="score-box">0</div>
                        </div>
                    </div>
                </div>

                <div class="board-wrapper">
                    <div id="board" class="board"></div>

                    <div id="boardOverlay" class="board-overlay hidden">
                        <div class="winner-box">
                            <h2 id="winnerText"></h2>
                            <button id="confirmWinBtn" type="button">OK</button>
                        </div>
                    </div>
                </div>
            </main>
        </section>
    </div>

    <script src="pis_game.js?v=5"></script>
</body>
</html>
