<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Sedma Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <button id="menuButton" class="menu-button" type="button" title="Menu">☰</button>
            <div class="app-title">
                <h1>Sedma Online</h1>
                <p id="activePlayerName" class="active-player-name">Nepřihlášen</p>
            </div>
        </header>

        <main class="screen-layout">
            <section id="menuScreen" class="screen active">
                <div class="panel">
                    <h2>Server</h2>
                    <label>
                        Adresa serveru RPi
                        <input id="serverUrlInput" type="text" value="https://newspapers-drew-cork-storm.trycloudflare.com">
                    </label>
                    <label>
                        Název serveru
                        <input id="serverNameInput" type="text" value="Sedma server PC">
                    </label>
                    <button id="connectButton" class="secondary-button" type="button">Připojit k serveru</button>
                    <p id="connectionStatus" class="status-text">Nepřipojeno</p>
                </div>

                <div class="panel">
                    <h2>Vytvořit hru</h2>

                    <label>Název hry<input id="gameNameInput" type="text" value="Moje Sedma"></label>
                    <label>Jméno hráče<input id="playerNameInput" type="text" value="Hráč"></label>

                    <label>
                        Počet hráčů
                        <select id="maxPlayersSelect">
                            <option value="2">2 hráči</option>
                            <option value="3">3 hráči</option>
                            <option value="4">4 hráči</option>
                        </select>
                    </label>

                    <label>
                        Týmy
                        <select id="teamModeSelect">
                            <option value="solo">Každý za sebe</option>
                            <option value="opposite">Standard: 1+3 proti 2+4</option>
                            <option value="random">Náhodné týmy</option>
                        </select>
                    </label>

                    <label>
                        Režim informací o balíku
                        <select id="assistModeSelect">
                            <option value="normal">Normální: počet karet</option>
                            <option value="blind">Slepý: nic během hry</option>
                            <option value="amateur">Začátečník: seznam karet v balíku</option>
                        </select>
                    </label>

                    <label>
                        Čas na tah
                        <select id="turnTimeModeSelect">
                            <option value="live">Živá hra</option>
                            <option value="1h">1 hodina</option>
                            <option value="12h">12 hodin</option>
                            <option value="24h">24 hodin</option>
                        </select>
                    </label>

                    <label>Heslo pro privátní hru<input id="passwordInput" type="text" placeholder="Nepovinné"></label>
                    <button id="createGameButton" class="primary-button" type="button">Vytvořit hru</button>
                </div>

                <div class="panel wide-panel">
                    <h2>Otevřené hry</h2>
                    <div id="gamesList" class="games-list"></div>
                </div>
            </section>

            <section id="lobbyScreen" class="screen">
                <div class="panel lobby-panel">
                    <h2 id="lobbyTitle">Lobby</h2>
                    <p id="lobbyInfo"></p>
                    <div id="playersList" class="players-list"></div>
                    <div class="lobby-actions">
                        <button id="readyButton" class="primary-button" type="button">Jsem připraven</button>
                        <button id="fillBotsButton" class="secondary-button" type="button">Doplnit počítače</button>
                    </div>
                </div>
            </section>

            <section id="gameScreen" class="screen">
                <div class="game-layout">
                    <aside id="desktopSidePanel" class="desktop-side-panel">
                        <div class="side-panel-header">
                            <strong>Menu hry</strong>
                            <button id="closeSidePanelButton" class="secondary-button small" type="button">Zavřít</button>
                        </div>

                        <h3>Hra</h3>
                        <div id="sideGameInfo" class="side-box"></div>

                        <h3>Hráči</h3>
                        <div id="sidePlayersInfo" class="side-box"></div>

                        <h3>Pozice balíčku</h3>
                        <div class="deck-position-buttons">
                            <button class="deck-pos-button" data-deck-position="left" type="button">Vlevo</button>
                            <button class="deck-pos-button active" data-deck-position="center" type="button">Střed</button>
                            <button class="deck-pos-button" data-deck-position="right" type="button">Vpravo</button>
                        </div>

                        <h3>Akce</h3>
                        <button id="leaveGameSideButton" class="danger-button full" type="button">Opustit hru</button>
                        <button id="leaveTableSideButton" class="danger-button full" type="button">Odejít od stolu</button>
                    </aside>

                    <div id="gameTable" class="game-table deck-pos-center">
                        <div class="player-zone player-top" id="playerTop"></div>
                        <div class="player-zone player-left" id="playerLeft"></div>
                        <div class="player-zone player-right" id="playerRight"></div>

                        <div class="table-center">
                            <div id="serverSpinner" class="server-spinner hidden"></div>
                            <button id="deckButton" class="deck-button" type="button" title="Klikni pro informace o balíku">
                                <span id="deckInfoBadge" class="deck-info-badge hidden"></span>
                            </button>
                            <div id="playedCards" class="played-cards"></div>
                            <div id="resultOverlay" class="result-overlay hidden"></div>
                        </div>

                        <div class="player-bottom-area">
                            <button id="discardSlot" class="discard-slot" type="button">Odklad</button>
                            <div class="bottom-main-area">
                                <div class="player-zone player-bottom" id="playerBottom"></div>
                                <button id="fireButton" class="fire-button hidden" type="button">FIRE</button>
                                <button id="passButton" class="pass-button hidden" type="button">PASS</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="deckModal" class="modal hidden">
        <div class="modal-card">
            <button id="deckModalCloseButton" class="modal-close" type="button">×</button>
            <h2>Informace o balíku</h2>
            <div id="deckModalContent"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
